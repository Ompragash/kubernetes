pipeline:
  id: pipeline_kubernetes_build_f603
  name: pipeline_kubernetes_build_f603
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go and Build
          id: setup_go_and_build
          run:
            shell: bash
            script: |-
              set -euo pipefail
              # Install system prerequisites used by the k8s build/test scripts.
              sudo apt-get update -qq
              sudo apt-get install -y -qq jq rsync build-essential
              # Install the Go toolchain pinned by .go-version (1.27.1).
              GO_VERSION="1.27.1"
              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
              sudo rm -rf /usr/local/go
              sudo tar -C /usr/local -xzf /tmp/go.tar.gz
              export PATH="/usr/local/go/bin:${PATH}"
              # Keep Go caches in a hidden dir so recursive ./... discovery ignores them.
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              export PATH="${GOPATH}/bin:${PATH}"
              command -v go
              go version
              # Build the full project via the repository's build entry point.
              make all
        - name: Test
          id: test
          run:
            shell: bash
            env:
              CI: "true"
            script: |-
              set -euo pipefail
              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              export PATH="${GOPATH}/bin:${PATH}"
              go version
              mkdir -p "$(pwd)/.harness/reports" "$(pwd)/.harness/coverage"
              # Produce JUnit XML and Go coverage via the repo's own test harness.
              export KUBE_JUNIT_REPORT_DIR="$(pwd)/.harness/reports"
              export KUBE_COVER="y"
              export KUBE_COVER_REPORT_DIR="$(pwd)/.harness/coverage"
              make test
            report:
              type: junit
              paths:
                - .harness/reports/junit_*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              set -euo pipefail
              test -s ".harness/coverage/combined-coverage.out"
              hcli cov upload --file=".harness/coverage/combined-coverage.out"
  tags:
    onboarding: "true"
