pipeline:
  id: pipeline_kubernetes_build_5af4
  name: pipeline_kubernetes_build_5af4
  stages:
    - name: Build and Test
      id: build_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go
          id: setup_go
          run:
            shell: bash
            script: |-
              set -euo pipefail
              GO_VERSION="1.27.1"
              echo "Installing Go ${GO_VERSION}..."
              curl -sSfL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xzf -
              export PATH="/usr/local/go/bin:${PATH}"
              go version
              echo "Go installation complete"
        - name: Verify Go and Tools
          id: verify_tools
          run:
            shell: bash
            script: |-
              set -euo pipefail
              export PATH="/usr/local/go/bin:${PATH}"
              echo "Verifying Go installation..."
              go version
              which go
              echo "Verifying required tools..."
              make --version
              jq --version || echo "jq not found, will be installed by test scripts"
        - name: Run Tests
          id: test
          run:
            shell: bash
            script: |-
              set -euo pipefail
              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              mkdir -p .harness/reports .harness/coverage

              # Run a focused subset of tests to keep runtime manageable
              # Using pkg/util as a representative test package
              export KUBE_JUNIT_REPORT_DIR=".harness/reports"
              export KUBE_COVER="y"
              export KUBE_COVER_REPORT_DIR=".harness/coverage"
              export KUBE_RACE=""
              export KUBE_TIMEOUT="-timeout=300s"

              # Run tests for core packages - this is a representative subset
              make test WHAT="./pkg/util/..."
            report:
              type: junit
              paths:
                - .harness/reports/*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              if [ -f ".harness/coverage/combined-coverage.out" ]; then
                echo "Uploading coverage report..."
                hcli cov upload --file=".harness/coverage/combined-coverage.out"
              else
                echo "No coverage file found, skipping upload"
                ls -la .harness/coverage/ || true
              fi
  tags:
    onboarding: "true"
