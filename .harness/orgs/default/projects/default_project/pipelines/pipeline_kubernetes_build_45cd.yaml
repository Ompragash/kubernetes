pipeline:
  id: pipeline_kubernetes_build_45cd
  name: pipeline_kubernetes_build_45cd
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Go
          id: setup_go
          run:
            shell: bash
            script: |-
              set -euo pipefail
              GO_VERSION=1.27.1
              cd /tmp
              curl -fsSL -o go.tar.gz "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
              sudo rm -rf /usr/local/go
              sudo tar -C /usr/local -xzf go.tar.gz
              export PATH="/usr/local/go/bin:${PATH}"
              go version
        - name: Build
          id: build
          run:
            shell: bash
            script: |-
              set -euo pipefail
              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              export PATH="${GOPATH}/bin:${PATH}"
              go version
              make all
        - name: Test
          id: test
          run:
            shell: bash
            script: |-
              set -euo pipefail
              export PATH="/usr/local/go/bin:${PATH}"
              export GOPATH=/harness/.cache/go
              export GOMODCACHE=/harness/.cache/go/pkg/mod
              export GOCACHE=/harness/.cache/go-build
              export PATH="${GOPATH}/bin:${PATH}"
              export CI=true
              command -v jq >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq jq; }
              go version
              mkdir -p .harness/reports .harness/coverage
              export KUBE_JUNIT_REPORT_DIR="$(pwd)/.harness/reports"
              export KUBE_COVER=y
              export KUBE_COVER_REPORT_DIR="$(pwd)/.harness/coverage"
              make test
            report:
              type: junit
              paths:
                - .harness/reports/*.xml
        - name: Upload Coverage
          id: upload_coverage
          run:
            shell: bash
            script: |-
              set -euo pipefail
              test -s ".harness/coverage/combined-coverage.out"
              hcli cov upload --file=".harness/coverage/combined-coverage.out"
  tags:
    onboarding: "true"
